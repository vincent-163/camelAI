name: Deploy Telegram Lite

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-telegram-lite
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify tested head
        if: github.event_name == 'workflow_run'
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$TESTED_SHA"
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --yes wrangler@4.115.0 -- deploy --config workers/telegram-lite/wrangler.jsonc
      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          CAMELAI_REPO_TOKEN: ${{ secrets.CAMELAI_REPO_TOKEN }}
          CAMELAI_AI_API_KEY: ${{ secrets.CAMELAI_AI_API_KEY }}
        run: |
          umask 077
          jq -n \
            --arg telegram "$TELEGRAM_BOT_TOKEN" \
            --arg webhook "$TELEGRAM_WEBHOOK_SECRET" \
            --arg github "$CAMELAI_REPO_TOKEN" \
            --arg ai "$CAMELAI_AI_API_KEY" \
            '{TELEGRAM_BOT_TOKEN:$telegram,TELEGRAM_WEBHOOK_SECRET:$webhook,GITHUB_TOKEN:$github,AI_API_KEY:$ai}' \
            > /tmp/camelai-secrets.json
          npm exec --yes wrangler@4.115.0 -- secret bulk /tmp/camelai-secrets.json \
            --config workers/telegram-lite/wrangler.jsonc
          rm -f /tmp/camelai-secrets.json
      - name: Register Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode 'url=https://camelai-telegram-172a28c1.ouihfugxhcqe.workers.dev/telegram/webhook' \
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message"]'
