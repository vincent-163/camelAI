name: Deploy Telegram Lite

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      audio_smoke:
        description: Run an end-to-end /audio Telegram smoke test
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-telegram-lite
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify tested head
        if: github.event_name == 'workflow_run'
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$TESTED_SHA"
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --yes wrangler@4.115.0 -- deploy --config workers/telegram-lite/wrangler.jsonc
      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          CAMELAI_REPO_TOKEN: ${{ secrets.CAMELAI_REPO_TOKEN }}
          CAMELAI_AI_API_KEY: ${{ secrets.CAMELAI_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          umask 077
          jq -n \
            --arg telegram "$TELEGRAM_BOT_TOKEN" \
            --arg webhook "$TELEGRAM_WEBHOOK_SECRET" \
            --arg github "$CAMELAI_REPO_TOKEN" \
            --arg ai "$CAMELAI_AI_API_KEY" \
            --arg openrouter "$OPENROUTER_API_KEY" \
            '{TELEGRAM_BOT_TOKEN:$telegram,TELEGRAM_WEBHOOK_SECRET:$webhook,GITHUB_TOKEN:$github,AI_API_KEY:$ai,OPENROUTER_API_KEY:$openrouter}' \
            > /tmp/camelai-secrets.json
          npm exec --yes wrangler@4.115.0 -- secret bulk /tmp/camelai-secrets.json \
            --config workers/telegram-lite/wrangler.jsonc
          rm -f /tmp/camelai-secrets.json
      - name: Register Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode 'url=https://camelai-telegram-172a28c1.ouihfugxhcqe.workers.dev/telegram/webhook' \
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message"]'
      - name: Smoke test Telegram audio
        if: github.event_name == 'workflow_dispatch' && inputs.audio_smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          chat_id=524019827
          api="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          worker='https://camelai-telegram-172a28c1.ouihfugxhcqe.workers.dev/telegram/webhook'
          timeout 110 npm exec --yes wrangler@4.115.0 -- tail \
            --format json \
            --config workers/telegram-lite/wrangler.jsonc \
            > /tmp/audio-smoke-tail.jsonl 2>&1 &
          tail_pid=$!
          sleep 8
          seed_id=$(curl --fail-with-body --silent --show-error -X POST "$api/sendMessage" \
            --data-urlencode "chat_id=$chat_id" \
            --data-urlencode 'text=camelAI /audio smoke test' | jq -r '.result.message_id')
          bot_message_ids="$seed_id"
          cleanup() {
            for message_id in $bot_message_ids; do
              curl --silent -X POST "$api/deleteMessage" \
                --data-urlencode "chat_id=$chat_id" \
                --data-urlencode "message_id=$message_id" >/dev/null || true
            done
          }
          trap cleanup EXIT
          jq -n \
            --argjson message_id "$seed_id" \
            --argjson chat_id "$chat_id" \
            '{update_id:(now|floor),message:{message_id:$message_id,chat:{id:$chat_id},from:{id:$chat_id,first_name:"Audio Smoke"},text:"/audio 请只回答：语音测试成功。"}}' \
            > /tmp/audio-smoke-update.json
          curl --fail-with-body --silent --show-error -X POST "$worker" \
            -H "x-telegram-bot-api-secret-token: $TELEGRAM_WEBHOOK_SECRET" \
            -H 'content-type: application/json' \
            --data-binary @/tmp/audio-smoke-update.json >/dev/null
          sleep 75
          found_text=0
          found_voice=0
          for candidate in $(seq $((seed_id + 1)) $((seed_id + 8))); do
            payload=$(curl --silent -X POST "$api/forwardMessage" \
              --data-urlencode "chat_id=$chat_id" \
              --data-urlencode "from_chat_id=$chat_id" \
              --data-urlencode "message_id=$candidate")
            if ! jq -e '.ok == true' <<<"$payload" >/dev/null; then
              continue
            fi
            forwarded_id=$(jq -r '.result.message_id' <<<"$payload")
            curl --silent -X POST "$api/deleteMessage" \
              --data-urlencode "chat_id=$chat_id" \
              --data-urlencode "message_id=$forwarded_id" >/dev/null || true
            if jq -e '.result.from.is_bot == true' <<<"$payload" >/dev/null; then
              case " $bot_message_ids " in
                *" $candidate "*) ;;
                *) bot_message_ids="$bot_message_ids $candidate" ;;
              esac
            fi
            jq -r '["candidate", (.result.message_id|tostring), "text", ((.result.text // "")|.[0:160]), "voice", ((.result.voice.file_id? // "")|length|tostring)] | @tsv' <<<"$payload"
            if jq -e '.result.text // "" | contains("语音测试成功")' <<<"$payload" >/dev/null; then
              found_text=1
            fi
            if jq -e '.result.voice.file_id | length > 0' <<<"$payload" >/dev/null 2>&1; then
              found_voice=1
            fi
          done
          if (( found_text == 1 && found_voice == 1 )); then
            kill "$tail_pid" >/dev/null 2>&1 || true
            wait "$tail_pid" >/dev/null 2>&1 || true
            echo "Telegram /audio smoke passed: text and voice received"
            exit 0
          fi
          kill "$tail_pid" >/dev/null 2>&1 || true
          wait "$tail_pid" >/dev/null 2>&1 || true
          echo '--- Worker tail ---'
          tail -200 /tmp/audio-smoke-tail.jsonl
          echo "Telegram /audio smoke failed: text=$found_text voice=$found_voice" >&2
          exit 1
